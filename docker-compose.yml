services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d urlshortener"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/urlshortener
      SPRING_R2DBC_USERNAME: app
      SPRING_R2DBC_PASSWORD: secret
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/urlshortener
      SPRING_FLYWAY_USER: app
      SPRING_FLYWAY_PASSWORD: secret
      APP_BASE_URL: http://localhost:8080
      # Each replica MUST get a distinct WORKER_ID (0-1023) to avoid Snowflake ID collisions.
      WORKER_ID: 1
      RATE_LIMIT_CAPACITY: 20
      RATE_LIMIT_REFILL_PER_SECOND: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data: