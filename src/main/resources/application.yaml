spring:
  application:
    name: urlshortener
  r2dbc:
    url: r2dbc:postgresql://localhost:15432/urlshortener
    username: app
    password: secret
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    url: jdbc:postgresql://localhost:15432/urlshortener
    user: app
    password: secret
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: urlshortener-analytics
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend:
    origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  snowflake:
    worker-id: ${WORKER_ID:1}
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:20}
    refill-tokens-per-second: ${RATE_LIMIT_REFILL_PER_SECOND:5}
  kafka:
    click-events-topic: ${CLICK_EVENTS_TOPIC:url.click-events}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-32bytes-minimum!}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
  security:
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}

server:
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.satyam: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"